# Copy to resilience-local-dev.yml; fill in YOUR real business queries and dedicated target table.
# DEV never creates, seeds, truncates or drops tables. Prepare target + audit schema manually.
resilience:
  environment: dev
  phase-timeout: 180s
  # Supply lazy, annotated host DataSources in the parent and each worker JVM.
  # Read resilience.source-proxy.port / resilience.target-proxy.port for the allocated routes.
  configuration-classes: [your.project.MigrationDataSourcesConfiguration]
  source-proxy:
    upstream-host: ${DEV_ORACLE_HOST}
    upstream-port: ${DEV_ORACLE_PORT:1521}
    port: 0
  target-proxy:
    upstream-host: ${DEV_PG_HOST}
    upstream-port: ${DEV_PG_PORT:5432}
    port: 0
  validation:
    customer:
      # Same stable business slice as select-sql, identical fields order, deterministic unique-key ordering.
      source-sql: SELECT ID, NAME, AMOUNT FROM BUSINESS.CUSTOMER WHERE ID BETWEEN ${DEV_ID_MIN} AND ${DEV_ID_MAX} ORDER BY ID
      target-sql: SELECT ID, NAME, AMOUNT FROM MIGRATION_TEST.CUSTOMER_COPY ORDER BY ID
data-migration:
  job-id: ${RESILIENCE_JOB_ID}
  strategy:
    max-concurrent-tables: 1
    skip-limit: 0
    transient-retry-count: 2
    retry-initial-backoff: 1s
    retry-max-backoff: 2s
    audit:
      table-name: MIGRATION_TEST.MIGRATION_AUDIT
  tables:
    - name: customer
      batch-size: 500
      target-table: MIGRATION_TEST.CUSTOMER_COPY
      primary-key: [ID]
      worker-count: 1
      mode: APPEND_RESUME
      select-sql: SELECT ID, NAME, AMOUNT FROM BUSINESS.CUSTOMER WHERE ID BETWEEN ${DEV_ID_MIN} AND ${DEV_ID_MAX} ORDER BY ID
      insert-sql: INSERT INTO MIGRATION_TEST.CUSTOMER_COPY(ID, NAME, AMOUNT) VALUES (?, ?, ?)
      fields:
        - { source-column: ID, target-jdbc-type: BIGINT }
        - { source-column: NAME, target-jdbc-type: VARCHAR }
        - { source-column: AMOUNT, target-jdbc-type: DECIMAL }
